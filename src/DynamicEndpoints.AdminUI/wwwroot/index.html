<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="__BASE__/admin.css?v=__VERSION__">
<script id="admin-config" type="application/json">__CONFIG__</script>
</head>
<body>
<header>
  <h1>⚡ <span id="title">Dynamic Endpoints</span></h1>
  <span class="muted hide-sm">runtime-defined, persistent HTTP endpoints</span>
  <nav id="links"></nav>
</header>

<main>
  <div class="toolbar">
    <h2>Endpoints</h2>
    <span class="muted" id="count"></span>
    <span class="spacer"></span>
    <input id="filter" type="search" placeholder="Filter…" class="hide-sm" style="width:200px" oninput="renderList()">
    <button onclick="reloadFromStore()" title="Re-read definitions from the store">↻ Reload</button>
    <button class="primary" onclick="openEditor()">＋ New endpoint</button>
  </div>
  <div id="list"></div>
</main>

<div id="shell">
  <div class="backdrop" onclick="closeDrawer()"></div>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="head"><h2 id="drawer-title"></h2><button onclick="closeDrawer()" aria-label="Close">✕</button></div>
    <div class="body" id="drawer-body"></div>
    <div class="foot" id="drawer-foot"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="__BASE__/admin.js?v=__VERSION__"></script>
</body>
</html>
