# Reverse proxy of samples/docker-compose.yml: spreads requests over the sample instances.
server {
    listen 8080;

    location / {
        resolver 127.0.0.11 valid=10s;          # Docker's DNS – picks up every replica of "sample"
        set $upstream http://sample:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
