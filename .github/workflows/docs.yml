name: Docs

# Builds the documentation site (docs/, docfx with the API reference from the XML docs of src/) and publishes it to GitHub Pages.
# Enable it once under Settings → Pages → Source: "GitHub Actions". Pull requests only build the site.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/**
      - dotnet-tools.json
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - src/**
      - dotnet-tools.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push doesn't cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
