name: Release

# Publishes the NuGet packages when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Authentication uses NuGet Trusted Publishing (OIDC) – no long-lived API key is stored in the repository.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets the job request the OIDC token NuGet exchanges for a short-lived API key

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore DynamicEndpoints.slnx

      - name: Build
        run: dotnet build DynamicEndpoints.slnx --configuration Release --no-restore -p:Version=$VERSION

      - name: Test
        run: dotnet test DynamicEndpoints.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack DynamicEndpoints.slnx --configuration Release --no-build -p:Version=$VERSION --output artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
